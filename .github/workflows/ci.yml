name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build, run unit tests, and produce an lcov coverage report.
  # ---------------------------------------------------------------------------
  linux-build-test:
    name: Linux (gcc) + tests + coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libvulkan-dev vulkan-validationlayers spirv-tools glslang-tools \
            libsdl2-dev \
            libfmt-dev libspdlog-dev libglm-dev \
            libgtest-dev googletest \
            lcov

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGRAPHYNE_BUILD_TESTS=ON \
            -DGRAPHYNE_BUILD_EXAMPLES=ON \
            -DGRAPHYNE_COVERAGE=ON \
            -DGRAPHYNE_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Generate coverage report
        run: cmake --build build --target coverage

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/html

      - name: Upload lcov tracefile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: build/coverage/coverage.filtered.info

  # ---------------------------------------------------------------------------
  # Windows: just configure + build (no tests run because a Vulkan-capable
  # runner is required to run the engine itself, but the headless unit tests
  # could be enabled with a future runner image).
  # ---------------------------------------------------------------------------
  windows-build:
    name: Windows (MSVC) build
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "2024.01.12"

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.243.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure

  # ---------------------------------------------------------------------------
  # Format check.
  # ---------------------------------------------------------------------------
  code-quality:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run clang-format --dry-run
        run: |
          find project/include project/src tests examples -type f \
            \( -iname '*.cpp' -o -iname '*.h' -o -iname '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
